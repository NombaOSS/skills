name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:00 UTC: catch SDK releases that rename or remove methods.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/validate.mjs
      # The per-language references must match the README of each SDK's latest release.
      - run: node scripts/sync-sdk-references.mjs --check

  # Every SDK method named in the skills must exist in the published SDKs.
  api:
    name: api (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, php]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: matrix.sdk == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - if: matrix.sdk == 'php'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer
      # Writes build/api-calls.json, the SDK calls the skills mention.
      - run: node scripts/validate.mjs
      - if: matrix.sdk == 'node'
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @nombaoss/nomba-node
          node scripts/check-api-node.mjs
      - if: matrix.sdk == 'python'
        run: |
          pip install nomba
          python scripts/check_api_python.py
      - if: matrix.sdk == 'php'
        run: |
          composer require --no-interaction --no-progress nombaoss/nomba-php
          php scripts/check-api-php.php
