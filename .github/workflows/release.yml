name: Release

# Creates the vX.Y.Z tag and GitHub Release when the version in
# .claude-plugin/plugin.json changes on main (a release PR was merged).
# Ordinary merges are no-ops because the version already has a release.

on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine version and whether it is already released
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(jq -r .version .claude-plugin/plugin.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "released=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.released == 'false'
    # Requires a maintainer's approval before the write token is used.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for details."
